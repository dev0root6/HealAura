<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HealAura">
  <defs>
    <linearGradient id="ha-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb04a"/>
      <stop offset="0.55" stop-color="#ff7a52"/>
      <stop offset="1" stop-color="#ff4f6d"/>
    </linearGradient>
    <linearGradient id="ha-heart" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff4566"/>
    </linearGradient>
    <radialGradient id="ha-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd2a8" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffb08a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ha-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- soft aura glow -->
  <circle cx="256" cy="256" r="250" fill="url(#ha-glow)"/>

  <!-- aura rings, slightly offset like ripples -->
  <g class="ha-rings" fill="none" stroke="url(#ha-warm)" stroke-linecap="round">
    <circle class="ha-ring ha-ring-3" cx="256" cy="262" r="214" stroke-width="7" opacity="0.28"/>
    <circle class="ha-ring ha-ring-2" cx="256" cy="259" r="178" stroke-width="10" opacity="0.5"/>
    <path class="ha-ring ha-ring-1" d="M 120 300 A 142 142 0 1 1 392 300" stroke-width="14" opacity="0.9"/>
  </g>

  <!-- heart: two leaves meeting, healing as growth -->
  <g class="ha-heart">
    <path d="M256 384
             C 214 350, 150 306, 150 246
             C 150 206, 180 178, 216 178
             C 236 178, 249 188, 256 202
             C 263 188, 276 178, 296 178
             C 332 178, 362 206, 362 246
             C 362 306, 298 350, 256 384 Z"
          fill="url(#ha-heart)"/>
    <!-- a calm pulse: the heartbeat settling into an even breath -->
    <path class="ha-pulse" d="M 172 270 L 212 270 Q 220 270 224 260 L 236 228 Q 240 220 244 230 L 262 300
             Q 266 310 270 300 L 280 272 Q 283 266 290 266 C 306 266 314 282 330 278 C 336 276 338 272 340 270"
          fill="none" stroke="#fff" stroke-opacity="0.92" stroke-width="11" stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M168 238 C 172 206, 196 192, 222 196" fill="none" stroke="url(#ha-shine)" stroke-width="12"
          stroke-linecap="round"/>
  </g>

  <!-- sparkle -->
  <path class="ha-spark" d="M392 118 l9 25 25 9 -25 9 -9 25 -9 -25 -25 -9 25 -9 z" fill="#ffb04a"/>
  <circle class="ha-spark ha-spark-2" cx="122" cy="142" r="9" fill="#ff7a52" opacity="0.8"/>
</svg>
